<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智慧衣櫃與穿搭數據分析系統</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="navbar-brand">
                <i class="fa-solid fa-wand-magic-sparkles"></i> AI 智慧衣櫃系統
            </a>
            <span class="team-badge">B組 專題成果</span>
        </div>
    </nav>

    <div class="main-container">
        
        <section class="dashboard-card weather-section">
            <div class="weather-header">
                <div class="weather-info">
                    <i class="fa-solid fa-cloud-sun weather-icon"></i>
                    <div>
                        <h2>今日天氣與穿搭推薦</h2>
                        <p class="location-text"><i class="fa-solid fa-location-dot"></i> 即時定位：中部地區</p>
                    </div>
                </div>
                <div class="temp-display">26°C</div>
            </div>
            <div class="recommendation-box">
                <p class="recommendation-tag">AI 穿搭建議</p>
                <p class="recommendation-text">
                    今日氣溫舒適微風，推薦穿著<span class="highlight">「科技藍吸濕排汗短 T」</span>搭配<span class="highlight">「高彈性休閒九分褲」</span>。
                    早晚溫差較大，建議隨身攜帶一件薄防風外套以備不時之需。
                </p>
            </div>
        </section>

        <section class="metrics-grid">
            <div class="dashboard-card chart-container">
                <h3><i class="fa-solid fa-chart-pie"></i> 衣物分類分佈圖</h3>
                <div class="chart-wrapper">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
            
            <div class="dashboard-card chart-container">
                <h3><i class="fa-solid fa-chart-column"></i> 本週穿搭頻率統計</h3>
                <div class="chart-wrapper">
                    <canvas id="frequencyChart"></canvas>
                </div>
            </div>
        </section>

        <section class="wardrobe-section">
            <div class="section-title">
                <h3><i class="fa-solid fa-shirt"></i> 智慧衣櫃當季單品</h3>
                <p>點選單品可檢視詳細材質數據與 AI 建議洗滌方式</p>
            </div>
            
            <div class="clothing-grid">
                <div class="clothing-card">
                    <div class="card-img-placeholder">
                        <i class="fa-solid fa-shirt inner-icon"></i>
                    </div>
                    <div class="card-content">
                        <span class="category-tag">上衣 / T-Shirt</span>
                        <h4>科技藍吸濕排汗短 T</h4>
                        <p class="status-text"><span class="dot clean"></span> 狀態：已洗滌 (乾淨)</p>
                    </div>
                </div>

                <div class="clothing-card">
                    <div class="card-img-placeholder">
                        <i class="fa-solid fa-person-pants inner-icon"></i>
                    </div>
                    <div class="card-content">
                        <span class="category-tag">褲裝 / 休閒</span>
                        <h4>高彈性休閒九分褲</h4>
                        <p class="status-text"><span class="dot clean"></span> 狀態：已洗滌 (乾淨)</p>
                    </div>
                </div>

                <div class="clothing-card">
                    <div class="card-img-placeholder">
                        <i class="fa-solid fa-user-ninja inner-icon"></i>
                    </div>
                    <div class="card-content">
                        <span class="category-tag">外衣 / 防風</span>
                        <h4>機能型極輕量防風外套</h4>
                        <p class="status-text"><span class="dot dirty"></span> 狀態：待洗滌</p>
                    </div>
                </div>
            </div>
        </section>

    </div>

    <script>
        // 圓餅圖：衣物分類
        const ctxPie = document.getElementById('categoryChart').getContext('2d');
        new Chart(ctxPie, {
            type: 'pie',
            data: {
                labels: ['上衣類', '褲裝類', '外套類', '配件類'],
                datasets: [{
                    data: [40, 30, 20, 10],
                    backgroundColor: [
                        'rgba(56, 189, 248, 0.7)',  /* 螢光藍 */
                        'rgba(124, 77, 255, 0.7)',  /* 魅惑紫 */
                        'rgba(34, 211, 238, 0.7)',  /* 靛青 */
                        'rgba(148, 163, 184, 0.7)'  /* 科技灰 */
                    ],
                    borderColor: 'rgba(255, 255, 255, 0.1)',
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { labels: { color: '#94a3b8', font: { family: 'Noto Sans TC' } } }
                },
                animation: { duration: 1500, easing: 'easeOutQuart' }
            }
        });

        // 長條圖：穿搭頻率
        const ctxBar = document.getElementById('frequencyChart').getContext('2d');
        new Chart(ctxBar, {
            type: 'bar',
            data: {
                labels: ['週一', '週二', '週三', '週四', '週五', '週六', '週日'],
                datasets: [{
                    label: '穿搭出門次數',
                    data: [2, 1, 3, 2, 4, 1, 2],
                    backgroundColor: 'rgba(56, 189, 248, 0.5)',
                    borderColor: '#38bdf8',
                    borderWidth: 2,
                    borderRadius: 6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { labels: { color: '#94a3b8', font: { family: 'Noto Sans TC' } } }
                },
                scales: {
                    x: { grid: { display: false }, ticks: { color: '#94a3b8' } },
                    y: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#94a3b8', stepSize: 1 } }
                },
                animation: { duration: 1800, easing: 'easeOutQuart' }
            }
        });
    </script>
</body>
</html>
